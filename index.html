<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Build &amp; Break: Adventure</title>
<style>
:root{--bg:#f3f0ff;--fg:#1e1b3a;--card:#fff;--line:#d8d2f5;--ac:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100dvh;-webkit-touch-callout:none;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}

.brand{font-size:16px;color:var(--ac)}.g{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
button{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer;touch-action:manipulation}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=number]{width:48px;font:inherit;padding:4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
body[data-mode="edit"] .pl,body[data-mode="edit"] #hud{display:none}
body:not([data-mode="edit"]) .ed{display:none}
#main{flex:1;min-height:0;display:flex}
#wrap{flex:1;min-height:0;position:relative}#game{position:absolute;inset:0}#game canvas{touch-action:none}
#hud{position:absolute;top:8px;right:12px;z-index:2;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-variant-numeric:tabular-nums;text-align:right}
#pal{width:210px;flex:none;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
#pal h4{margin:10px 2px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
#pal summary{cursor:pointer;font-weight:700;padding:7px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);list-style:none}#pal summary::-webkit-details-marker{display:none}#pal summary::after{content:" ▸";float:right}#pal details[open]>summary::after{content:" ▾"}#pal details{display:flex;flex-direction:column;gap:4px}#pal details[open]>summary{background:var(--ac);color:#fff}
.tc{display:flex;align-items:center;gap:8px;text-align:left;width:100%;padding:4px 8px}
.tc canvas{width:28px;height:28px;flex:none;image-rendering:pixelated}
#info{margin-top:auto;position:sticky;bottom:-8px;background:var(--card);border-top:1px solid var(--line);padding:8px 0}
#info b{display:block}#info p{margin:2px 0 0;font-size:12.5px;opacity:.85}
@media (pointer:coarse),(max-width:760px){#main{flex-direction:column}#pal{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}#pal h4,#info{display:none}.tc{width:auto;flex-direction:column;gap:2px;font-size:10px;padding:3px 6px}#pal summary{white-space:nowrap}#pal details,#pal details[open]{flex-direction:row;align-items:center;flex:none}}
.ov{position:absolute;z-index:4;display:none;pointer-events:none;color:#fff;background:rgba(15,12,40,.82);border-radius:10px;font-weight:600;box-shadow:0 4px 14px #0005}
#fx{top:8px;left:8px;padding:4px 10px;font-size:13px}#tip{top:42px;left:8px;padding:5px 10px;font-size:13px;max-width:58%}
#st{top:46px;right:10px;padding:8px 12px;font-size:13px;max-width:min(340px,60%)}
#ban{top:14%;left:50%;transform:translateX(-50%);padding:10px 18px;font-size:18px;text-align:center;white-space:pre-line;max-width:88%;background:rgba(109,40,217,.92)}
#rot{display:none;bottom:10px;left:50%;transform:translateX(-50%);padding:6px 12px;font-size:12px;white-space:nowrap}
#dlg{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.box{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,92vw);box-sizing:border-box}
.box h2{margin:0 0 8px;font-size:18px}
textarea{width:100%;height:110px;box-sizing:border-box;font:12px monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.sw{width:32px;height:32px;padding:0;border-radius:50%}.sw.on{outline:3px solid var(--ac)}
#pad{display:none;position:absolute;left:0;right:0;bottom:0;z-index:3;justify-content:space-between;align-items:flex-end;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}

#pad button{pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;width:72px;height:72px;padding:0;border-radius:50%;font-size:26px;background:rgba(0,0,0,.45);color:#fff;border:2px solid rgba(255,255,255,.5)}

#pad button.dn{background:rgba(255,255,255,.4)}

@media (pointer:coarse) and (orientation:portrait){body:not([data-mode="edit"]) #rot{display:block}}
@media (pointer:coarse){body{user-select:none;-webkit-user-select:none}input,textarea{font-size:16px}#bar button{padding:6px 9px;font-size:13px}}
@media (max-width:760px){.brand{display:none}#hud{font-size:12px;padding:3px 8px;max-width:60%}#fx,#tip,#st{font-size:12px}#ban{font-size:15px}}
@media (pointer:coarse) and (max-height:480px){#pad button{width:58px;height:58px;font-size:22px}#pad .jb{width:76px;height:76px;font-size:13px}#pad .g{gap:8px}}

/* Responsive game layout: compact editor and full-screen touch play */
:root{--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html,body{width:100%;min-width:0;overscroll-behavior:none}
body{height:100%;height:100dvh;padding:0;box-sizing:border-box}
#bar{padding:calc(6px + var(--safe-t)) 10px 6px;gap:6px 10px;min-height:42px;box-sizing:border-box}
#main{min-width:0;min-height:0}
#wrap,#game{min-width:0;min-height:0}
#game canvas{display:block;max-width:100%;max-height:100%}
#pal{overscroll-behavior:contain}
#pad{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));}
#pad button{box-shadow:0 2px 8px #0005;-webkit-tap-highlight-color:transparent}
#pad button:focus{outline:none}
#rot{pointer-events:none}
@media (pointer:coarse){
  body{touch-action:pan-x pan-y}
  body:not([data-mode="edit"]){height:100dvh}
  body:not([data-mode="edit"]) #bar{min-height:38px;padding:calc(3px + var(--safe-t)) 8px 3px;gap:5px}
  body:not([data-mode="edit"]) #main{flex:1;min-height:0}
  body:not([data-mode="edit"]) #wrap{flex:1}
  body:not([data-mode="edit"]) #pad{display:flex}
  body:not([data-mode="edit"]) #rot{top:50%;bottom:auto;left:50%;transform:translate(-50%,-50%);white-space:normal;text-align:center;max-width:80%;font-size:14px}
  body[data-mode="edit"] #main{flex-direction:column}
  body[data-mode="edit"] #wrap{order:1;flex:1;min-height:120px}
  body[data-mode="edit"] #pal{order:2;width:100%;height:clamp(88px,19dvh,132px);flex:none;flex-direction:row;align-items:stretch;gap:6px;padding:7px 8px calc(7px + var(--safe-b));border-top:1px solid var(--line);border-bottom:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity}
  body[data-mode="edit"] #pal details{height:100%;flex:none;display:flex;flex-direction:column;align-items:stretch;gap:4px;scroll-snap-align:start}
  body[data-mode="edit"] #pal details[open]{flex-direction:row;align-items:center}
  body[data-mode="edit"] #pal summary{font-size:12px;padding:6px 8px}
  body[data-mode="edit"] #pal .tc{min-width:54px;width:54px;min-height:58px;flex-direction:column;justify-content:center;gap:2px;font-size:10px}
  body[data-mode="edit"] #pal .tc canvas{width:26px;height:26px}
  body[data-mode="edit"] #bar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  body[data-mode="edit"] #bar>.g{flex:none}
  body[data-mode="edit"] #bar label{font-size:12px}
  body[data-mode="edit"] #bar button{min-height:34px}
}
@media (pointer:coarse) and (orientation:landscape){
  body:not([data-mode="edit"]) #bar{min-height:34px}
  body:not([data-mode="edit"]) #pad{padding-bottom:calc(6px + var(--safe-b))}
  body:not([data-mode="edit"]) #pad button{width:clamp(48px,8vw,66px);height:clamp(48px,8vw,66px);font-size:22px}
  body:not([data-mode="edit"]) #pad .jb{width:clamp(62px,10vw,80px);height:clamp(62px,10vw,80px);font-size:13px}
  body[data-mode="edit"] #pal{height:clamp(76px,16dvh,108px)}
}
@media (pointer:coarse) and (orientation:portrait){
  body:not([data-mode="edit"]) #pad button{width:clamp(54px,13vw,72px);height:clamp(54px,13vw,72px)}
  body:not([data-mode="edit"]) #pad .jb{width:clamp(68px,16vw,88px);height:clamp(68px,16vw,88px)}
}
@media (max-height:420px){
  #bar{padding-top:3px;padding-bottom:3px}
  body[data-mode="edit"] #pal{height:72px}
}
@media (hover:none){
  button{ -webkit-tap-highlight-color:transparent}
}

        case"L":{const q=((now-this.t00)/1000+e.x*.011)%3.4,on=q>1.9;e.bm.setAlpha(on?.9:q>1.4?.25:0);if(on&&hit(e.x-4,e.y+16,8,e.fy-e.y-16))this.hurt();break}
        case"P":{const a=1.15*Math.sin((now-this.t00)/1000*2+e.x*.02),mx=e.x+Math.sin(a)*96,my=e.y+Math.cos(a)*96;e.s.setPosition(mx,my).setRotation(-a*2);this.gf.lineStyle(3,0x94a3b8).lineBetween(e.x,e.y-12,mx,my).fillStyle(0x94a3b8).fillCircle(e.x,e.y-12,5);if(hit(mx-13,my-13,26,26))this.hurt();break}
        case"R":{const a=(now-this.t00)/1000*2.2+e.x*.01;for(let n=1;n<=3;n++){const ox=e.x+Math.cos(a)*n*26,oy=e.y+Math.sin(a)*n*26;this.gf.fillStyle(0xf97316).fillCircle(ox,oy,8).fillStyle(0xfde047).fillCircle(ox,oy,4);if(hit(ox-8,oy-8,16,16))this.hurt(true)}break}
        case"W":e.s.setScale(1,1+.05*Math.sin(now/60));if(hit(e.x-14,e.y-160,28,160)){p.setVelocityY(Math.max(-340,b.velocity.y-3200*s));this.gf.fillStyle(0xbae6fd,.35).fillRect(e.x-14,e.y-160,28,160)}break;
        case"Q":{e.s.angle+=120*s;if(now>(this.pcd||0)&&hit(e.x-12,e.y-14,24,28)){const q=this.ents.filter(o=>o.t==="Q"),n=q.indexOf(e),o=q[n%2?n-1:n+1];if(o){this.pcd=now+900;p.body.reset(o.x,o.y);p.setVelocity(0,0)}}break}
        case"1":case"2":case"3":case"4":case"5":this.boss(e,s,now,px,py,pw,ph,hit);break;
        case"G":if(!e.on&&hit(e.x-14,e.y-16,28,32)){e.on=true;e.s.setTint(0x4ade80);this.bosses.forEach(bb=>{if(bb.t===String(e.R))bb.awake=true});this.banner("🚩 Boss awakened!")}break;
        case"E":e.s.setAlpha(open?1:.5);if(hit(e.x-12,e.y-14,24,30)){if(open)return this.win();if(now>(this.hintAt||0)){this.hintAt=now+1500;flash("The door is locked. Collect all keys and defeat every boss!")}}break;
      }
    }
    this.proj=this.proj.filter(q=>{q.life-=s;q.x+=q.vx*s;q.y+=q.vy*s;q.s.setPosition(q.x,q.y);let kill=q.life<=0||this.sol.has(Math.floor(q.x/S)+","+Math.floor(q.y/S));
      if(!kill&&q.en&&hit(q.x-6,q.y-6,12,12)){this.hurt(q.fire);kill=true}
      if(!kill&&!q.en)for(const bb of this.bosses)if(!bb.dead&&Math.abs(q.x-bb.x)<30&&Math.abs(q.y-bb.y)<30){this.dmg(bb,q.d);kill=true;break}
      if(kill)q.s.destroy();return!kill});
    this.crates.getChildren().forEach(c=>{if(c.y>H*S+40){c.setPosition(c.home[0],c.home[1]);c.setVelocity(0,0)}});
    if(p.y>H*S+40)return this.die();
    p.setAlpha(ghost?.35:now<this.inv&&Math.floor(now/80)%2?.4:1);
    if(fr)p.setTint(0x93c5fd);else if(fx.fire>now)p.setTint(0xfdba74);else if(fx.arm>now)p.setTint(0xa5f3fc);else p.clearTint();
    const act=Object.keys(fx).filter(n=>fx[n]>now&&fx[n]<1e11).map(n=>FXN[n]+" "+((fx[n]-now)/1000).toFixed(0)+"s");
    this.fxT.setText(act.join("   ")).setVisible(act.length>0);
    {const cm=COARSE,ow=["sword","fb","flame"].filter(n=>fx[n]>now),tp=[];
      if(this.wep&&fx[this.wep]>now)tp.push({sword:"⚔ Sword: "+(cm?"tap ⚔":"press X")+" to slash",fb:"🔥 Fireballs: "+(cm?"tap ⚔":"press X")+" to throw",flame:"🔥 Flamethrower: "+(cm?"hold ⚔":"hold X")+" to spray"}[this.wep]);
      if(ow.length>1)tp.push((cm?"⇄":"Q")+" switch weapon");
      if(fx.dash>now)tp.push((cm?"💨":"Shift")+" dash");
      const lb=this.bosses.filter(bb=>!bb.dead);
      if(lb.length){const nb=lb.reduce((a,bb)=>Math.abs(bb.x-px)<Math.abs(a.x-px)?bb:a);tp.push(Math.abs(nb.x-px)<700?(ow.length?"👹 Boss "+Math.max(0,Math.ceil(nb.hp))+"/"+nb.max+" HP"+(this.flagged.has(nb.t)&&!nb.awake?" (asleep until you touch its 🚩 flag)":""):"👹 Boss ahead! Grab a weapon pickup first"):"👹 Bosses left: "+lb.length+" (door stays locked)")}
      this.tip.setText(tp.join("   ·   "))}
    $("hud").textContent="Deaths "+this.deaths+" · "+(this.t0==null?0:(now-this.t0)/1000).toFixed(1)+"s"+(this.nk?" · Keys "+this.keysGot.size+"/"+this.nk:"")+(this.bosses.length?" · Bosses "+this.bosses.filter(bb=>bb.dead).length+"/"+this.bosses.length:"");
  }
  die(){
    if(this.dead)return;this.dead=true;this.deaths++;
    this.cameras.main.shake(150,.012);this.sw.setVisible(false);this.p.setVisible(false);this.p.body.enable=false;
    this.time.delayedCall(450,()=>{
      this.p.enableBody(true,this.spawn[0],this.spawn[1],true,true);this.p.setVelocity(0,0).clearTint();
      this.keysGot=new Set(this.cpKeys);const kw={sword:this.fx.sword,fb:this.fx.fb,flame:this.fx.flame};this.fx=Object.assign(FX0(),kw);this.proj.forEach(q=>q.s.destroy());this.proj=[];this.frz=0;this.inv=this.time.now+800;
      this.ents.forEach(e=>{
        if(e.t==="k"){e.gone=this.keysGot.has(e.i);e.s.setVisible(!e.gone)}
        else if("eotjAH".includes(e.t)){e.gone=false;e.s.setVisible(true)}
        else if(e.t==="G"){e.on=false;e.s.clearTint()}
        else if("12345".includes(e.t)&&!e.dead){e.awake=false;e.hp=e.max;e.x=e.fx;e.y=e.by;e.vy=0;e.vx=0;e.s.setPosition(e.x,e.y)}
        else if(e.t==="l"){e.fall=false;e.done=false;e.vy=0;e.y=e.y0;e.s.setY(e.y0)}
        else if(e.t==="i"){e.up=false;e.s.setVisible(false)}
      });
      this.crates.getChildren().forEach(c=>{c.setPosition(c.home[0],c.home[1]);c.setVelocity(0,0)});
      this.coy=0;this.buf=0;this.dead=false;
    });
  }
  win(){
    this.over=true;this.p.body.enable=false;
    const t=((this.time.now-(this.t0==null?this.time.now:this.t0))/1000).toFixed(1),txt="<p>Time <b>"+t+"s</b> · Deaths <b>"+this.deaths+"</b></p>";
    this.time.delayedCall(350,()=>dlg("You made it! 🎉",txt,[["Play again",()=>go(G.mode)],["Back to editor",()=>go("edit")]]));
  }
}
const game=new Phaser.Game({type:Phaser.AUTO,parent:"game",width:960,height:540,backgroundColor:"#1b1f3b",pixelArt:true,
  physics:{default:"arcade",arcade:{gravity:{y:1500},debug:false}},
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:Main});
hud();
</script></body></html>
